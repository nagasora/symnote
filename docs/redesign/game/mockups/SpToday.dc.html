<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ きょう</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1C6AA6}a:hover{color:#134d7a}
.sn{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#3B2A20;background:#FFF6E6;font-weight:500}
.h{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:800;letter-spacing:.01em}
.num{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.card{background:#FFFFFF;border:2px solid #F0DFC2;border-radius:20px;box-shadow:0 4px 0 #F0DFC2}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:16px;min-height:48px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#3B2A20;text-decoration:none}
.btn-sun{background:#FFC23D;box-shadow:0 4px 0 #E09A00}
.btn-ghost{background:#FFFFFF;border:2px solid #F0DFC2;box-shadow:0 4px 0 #F0DFC2}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.c-xp{background:#E3F6E9;color:#1F7A44}
.c-coin{background:#FFF0C7;color:#8A5A00}
.c-sky{background:#E2F2FD;color:#1C6AA6}
.c-berry{background:#FFE6E1;color:#B53A28}
.c-grape{background:#EEE8FF;color:#6045C2}
.c-plain{background:#FFF0D6;color:#6B5546}
.check{width:44px;height:44px;border-radius:14px;border:3px solid #E6D3B3;background:#FFFFFF;flex:none;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:#FFFFFF}
.check-done{background:#4CB872;border-color:#2E8A50;box-shadow:0 3px 0 #2E8A50}
.check-boss{border-color:#FF7A66}
.bar{height:14px;border-radius:999px;background:#F3E6CF;overflow:hidden}
.bar-fill{display:block;height:100%;background:#4CB872;border-radius:999px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.faint{color:#7A6555}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px}
.row+.row{border-top:2px dashed #F0DFC2}
.label{font-size:12px;font-weight:700;color:#7A6555;letter-spacing:.06em}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:11px;font-weight:700;color:#7A6555;text-decoration:none}
.tab-on{color:#3B2A20}
</style>
</helmet>
<div class="sn" style="width: 390px; height: 844px; position: relative; overflow: hidden;">
  <div style="box-sizing: border-box; padding: 20px 16px 110px; display: flex; flex-direction: column; gap: 16px;">
    <header style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 2px;"><span class="label num">10月22日（木）</span><h1 class="h" style="margin: 0; font-size: 26px;">きょうの冒険</h1></div>
      <div style="display: flex; gap: 6px;">
        <span class="chip c-berry num" style="height: 32px; font-size: 13px;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px;"><path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 3-6 1 2 2 2 3 2-1-3 0-5 0-7z"></path></svg>5</span>
        <span class="chip c-coin num" style="height: 32px; font-size: 13px;">340 G</span>
      </div>
    </header>

    <div style="display: flex; gap: 10px; align-items: center;">
      <svg viewBox="0 0 64 64" width="48" height="48" aria-hidden="true" style="flex: none;"><ellipse cx="25" cy="12" rx="8" ry="4.5" transform="rotate(-30 25 12)" fill="#4CB872"></ellipse><ellipse cx="39" cy="12" rx="8" ry="4.5" transform="rotate(30 39 12)" fill="#4CB872"></ellipse><rect x="31" y="12" width="2.4" height="9" rx="1.2" fill="#2E8A50"></rect><ellipse cx="32" cy="40" rx="24" ry="21" fill="#FFD36B" stroke="#E09A00" stroke-width="2"></ellipse><ellipse cx="24" cy="38" rx="3" ry="4" fill="#3B2A20"></ellipse><ellipse cx="40" cy="38" rx="3" ry="4" fill="#3B2A20"></ellipse><ellipse cx="17" cy="46" rx="4" ry="2.5" fill="#FF9E8A"></ellipse><ellipse cx="47" cy="46" rx="4" ry="2.5" fill="#FF9E8A"></ellipse><path d="M28 46q4 4 8 0" stroke="#3B2A20" stroke-width="2.5" fill="none" stroke-linecap="round"></path></svg>
      <div style="flex: 1; background: #FFFFFF; border: 2px solid #F0DFC2; border-radius: 16px; padding: 10px 14px; font-size: 14px; line-height: 1.6;">おはよう！きょうは<b>3つ</b>で十分。まずは見積書からいこう。</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="bar" style="flex: 1; height: 16px;"><span class="bar-fill" style="width: 40%;"></span></div>
      <span class="num" style="font-size: 13px;">2/5</span>
      <svg viewBox="0 0 24 24" width="26" height="26" aria-label="宝箱まであと3つ" role="img"><rect x="3" y="9" width="18" height="11" rx="2.5" fill="#FFC23D" stroke="#8A5A00" stroke-width="1.8"></rect><path d="M5 9a7 5 0 0 1 14 0" fill="#FFD36B" stroke="#8A5A00" stroke-width="1.8"></path><rect x="10.5" y="11" width="3" height="4" rx="1" fill="#8A5A00"></rect></svg>
    </div>

    <section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px; border-color: #FFC23D; box-shadow: 0 4px 0 #E09A00;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><span class="label">つぎの一手</span><span class="chip c-xp num">+12 XP</span></div>
      <h2 class="h" style="margin: 0; font-size: 21px;">田中さんへ見積書を送る</h2>
      <div style="display: flex; gap: 6px;"><span class="chip c-plain">★ 15分</span><span class="chip c-sky">18:00 まで</span></div>
      <div style="display: flex; gap: 10px;"><button class="btn btn-sun" type="button" style="flex: 1;">はじめる</button><button class="btn btn-ghost" type="button" style="flex: 1;">クリアした</button></div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h2 class="h" style="margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center;">きょうのクエスト<span class="num faint" style="font-size: 13px;">3</span><span class="faint" style="margin-left: auto; font-size: 12px;">体力 95/180分</span></h2>
      <div class="card">
        <div class="row"><button class="check check-boss" type="button" aria-label="クリアにする"></button><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;"><b style="font-size: 15px;">ゼミ資料のスライドを仕上げる</b><div style="display: flex; gap: 5px;"><span class="chip c-berry">大物 ★★★</span><span class="chip c-sky">15:00</span></div></div><span class="chip c-xp num">+34</span></div>
        <div class="row"><button class="check" type="button" aria-label="クリアにする"></button><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;"><b style="font-size: 15px;">英語の論文を1本要約する</b><div style="display: flex; gap: 5px;"><span class="chip c-plain">★★ 20分</span><span class="chip c-grape">英語論文</span></div></div><span class="chip c-xp num">+16</span></div>
        <div class="row"><button class="check check-done" type="button" aria-label="クリア済み。元に戻す"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3.2;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button><div style="flex: 1; min-width: 0;"><b style="font-size: 15px; color: #7A6555; text-decoration: line-through;">週報を書く</b></div><span class="chip c-coin num">+9 G</span></div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h2 class="h" style="margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center;">持ち越し<span class="num faint" style="font-size: 13px;">1</span></h2>
      <div class="card" style="background: #FFFBF3;">
        <div class="row"><button class="check" type="button" aria-label="クリアにする"></button><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 15px;">奨学金の継続手続き</b><span class="faint" style="font-size: 12px;">きのうまでの予定 ・ 左にスワイプで日を変える</span></div></div>
      </div>
    </section>
  </div>

  <nav aria-label="メイン" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 2px solid #F0DFC2; display: flex; align-items: center; padding: 6px 8px 22px;">
    <a class="tab tab-on" href="#today"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: #E09A00; width: 24px; height: 24px;"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>きょう</a>
    <a class="tab" href="#map"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"></path></svg>マップ</a>
    <div style="flex: 1; display: flex; justify-content: center;"><button class="btn btn-sun" type="button" aria-label="ミナに渡す" style="width: 60px; height: 60px; border-radius: 22px; padding: 0; margin-top: -26px;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px; stroke-width: 3;"><path d="M12 5v14M5 12h14"></path></svg></button></div>
    <a class="tab" href="#board" style="position: relative;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V2.5h6V4M9 10h6M9 14h4"></path></svg>依頼<span class="num" style="position: absolute; top: 4px; right: 18px; background: #FF7A66; color: #3B2A20; border-radius: 999px; font-size: 11px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;">4</span></a>
    <a class="tab" href="#me"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>じぶん</a>
  </nav>
</div>
</x-dc>
