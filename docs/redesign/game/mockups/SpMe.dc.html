<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ じぶん</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1C6AA6}a:hover{color:#134d7a}
.sn{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#3B2A20;background:#FFF6E6;font-weight:500}
.h{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:800;letter-spacing:.01em}
.num{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.card{background:#FFFFFF;border:2px solid #F0DFC2;border-radius:20px;box-shadow:0 4px 0 #F0DFC2}
.btn{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:14px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#3B2A20;text-decoration:none}
.btn-sun{background:#FFC23D;box-shadow:0 4px 0 #E09A00}
.bar{height:12px;border-radius:999px;background:#F3E6CF;overflow:hidden}
.bar-fill{display:block;height:100%;background:#4CB872;border-radius:999px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.faint{color:#7A6555}
.label{font-size:12px;font-weight:700;color:#7A6555;letter-spacing:.06em}
.d{aspect-ratio:1;border-radius:6px;background:#F3E6CF}
.d1{background:#BFE6CB}
.d2{background:#4CB872}
.d3{background:#2E8A50}
.dr{background:#E2F2FD;border:2px dashed #5AB8F5;box-sizing:border-box}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;text-align:center}
.medal{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.lrow{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;text-decoration:none;color:#3B2A20;font-weight:700;font-size:15px}
.lrow+.lrow{border-top:2px dashed #F0DFC2}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:11px;font-weight:700;color:#7A6555;text-decoration:none}
.tab-on{color:#3B2A20}
</style>
</helmet>
<div class="sn" style="width: 390px; height: 844px; position: relative; overflow: hidden;">
  <div style="box-sizing: border-box; padding: 20px 16px 110px; display: flex; flex-direction: column; gap: 14px;">
    <div class="card" style="padding: 16px; display: flex; gap: 14px; align-items: center;">
      <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true" style="flex: none;"><ellipse cx="25" cy="12" rx="8" ry="4.5" transform="rotate(-30 25 12)" fill="#4CB872"></ellipse><ellipse cx="39" cy="12" rx="8" ry="4.5" transform="rotate(30 39 12)" fill="#4CB872"></ellipse><rect x="31" y="12" width="2.4" height="9" rx="1.2" fill="#2E8A50"></rect><ellipse cx="32" cy="40" rx="24" ry="21" fill="#FFD36B" stroke="#E09A00" stroke-width="2"></ellipse><path d="M20 39q4-5 8 0M36 39q4-5 8 0" stroke="#3B2A20" stroke-width="2.6" fill="none" stroke-linecap="round"></path><ellipse cx="17" cy="46" rx="4" ry="2.5" fill="#FF9E8A"></ellipse><ellipse cx="47" cy="46" rx="4" ry="2.5" fill="#FF9E8A"></ellipse><path d="M27 45q5 7 10 0z" fill="#3B2A20"></path></svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
        <h1 class="h" style="margin: 0; font-size: 20px;">そら ・ Lv 7</h1>
        <span class="faint" style="font-size: 13px; font-weight: 700;">駆け出しの旅人</span>
        <div class="bar"><span class="bar-fill" style="width: 69%;"></span></div>
        <div style="display: flex; gap: 12px; font-size: 12px;"><span class="num" style="color: #1F7A44;">138/200 XP</span><span class="num" style="color: #B53A28;">5日連続</span><span class="num" style="color: #8A5A00;">340 G</span></div>
      </div>
    </div>

    <section class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><b class="h" style="font-size: 15px;">冒険のあしあと</b><span class="faint" style="font-size: 12px;">おやすみ券 のこり 1</span></div>
      <div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px;" aria-label="この4週間のクリア数" role="img">
        <span class="d d1"></span><span class="d d2"></span><span class="d"></span><span class="d d1"></span><span class="d d2"></span><span class="d d3"></span><span class="d dr"></span><span class="d d1"></span><span class="d d2"></span><span class="d d2"></span><span class="d"></span><span class="d d1"></span><span class="d d3"></span><span class="d d2"></span>
        <span class="d d2"></span><span class="d d1"></span><span class="d d2"></span><span class="d dr"></span><span class="d d1"></span><span class="d d2"></span><span class="d d3"></span><span class="d d2"></span><span class="d d1"></span><span class="d d2"></span><span class="d d3"></span><span class="d d2"></span><span class="d d1"></span><span class="d d2"></span>
      </div>
      <span class="faint" style="font-size: 12px;">点線の日は「おやすみ券」で連続記録を守った日</span>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><b class="h" style="font-size: 15px;">実績</b><a href="#achievements" style="font-size: 13px; font-weight: 700;">7 / 10</a></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
        <div class="badge"><span class="medal" style="background: #E3F6E9; color: #1F7A44;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px;"><path d="M12 21v-9M12 12c0-4-3-6-7-6 0 4 3 6 7 6zM12 10c0-3 2-5 6-5 0 3-2 5-6 5z"></path></svg></span>冒険の<br>はじまり</div>
        <div class="badge"><span class="medal" style="background: #FFE6E1; color: #B53A28;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px;"><path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 3-6 1 2 2 2 3 2-1-3 0-5 0-7z"></path></svg></span>一週間の<br>冒険</div>
        <div class="badge"><span class="medal" style="background: #FFF0C7; color: #8A5A00;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px;"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>朝の<br>一歩</div>
        <div class="badge" style="color: #7A6555;"><span class="medal" style="background: #F3E6CF;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>百戦の<br>勇者</div>
      </div>
    </section>

    <section class="card" style="padding: 6px 0;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px;">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span class="label">ごほうびショップ</span><b style="font-size: 15px;">カフェで好きなケーキ</b></div>
        <button class="btn btn-sun num" type="button">300 G で交換</button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 2px dashed #F0DFC2;">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 15px;">映画を1本見る</b><span class="faint num" style="font-size: 12px;">あと 160 G</span></div>
        <button class="btn num" type="button" disabled style="background: #F3E6CF; color: #7A6555;">500 G</button>
      </div>
    </section>

    <nav class="card" aria-label="そのほか">
      <a class="lrow" href="#journal"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: #2E8BCB;"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>冒険日誌（今週のふりかえり）<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: auto; color: #7A6555;"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a class="lrow" href="#settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: #6B5546;"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg>設定・ミナ・連携<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: auto; color: #7A6555;"><path d="M9 6l6 6-6 6"></path></svg></a>
    </nav>
  </div>

  <nav aria-label="メイン" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 2px solid #F0DFC2; display: flex; align-items: center; padding: 6px 8px 22px;">
    <a class="tab" href="#today"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>きょう</a>
    <a class="tab" href="#map"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"></path></svg>マップ</a>
    <div style="flex: 1; display: flex; justify-content: center;"><button class="btn btn-sun" type="button" aria-label="ミナに渡す" style="width: 60px; height: 60px; border-radius: 22px; padding: 0; margin-top: -26px;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px; stroke-width: 3;"><path d="M12 5v14M5 12h14"></path></svg></button></div>
    <a class="tab" href="#board"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V2.5h6V4M9 10h6M9 14h4"></path></svg>依頼</a>
    <a class="tab tab-on" href="#me"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; color: #7556D6;"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>じぶん</a>
  </nav>
</div>
</x-dc>

</html>
