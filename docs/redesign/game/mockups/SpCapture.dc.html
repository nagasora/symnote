<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ ミナに渡す</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1C6AA6}a:hover{color:#134d7a}
.sn{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#3B2A20;background:#FFF6E6;font-weight:500}
.h{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:800;letter-spacing:.01em}
.num{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:16px;min-height:48px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#3B2A20;text-decoration:none}
.btn-sun{background:#FFC23D;box-shadow:0 4px 0 #E09A00}
.btn-ghost{background:#FFFFFF;border:2px solid #F0DFC2;box-shadow:0 4px 0 #F0DFC2}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.c-xp{background:#E3F6E9;color:#1F7A44}
.c-sky{background:#E2F2FD;color:#1C6AA6}
.c-grape{background:#EEE8FF;color:#6045C2}
.c-plain{background:#FFF0D6;color:#6B5546}
.c-berry{background:#FFE6E1;color:#B53A28}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.faint{color:#7A6555}
.label{font-size:12px;font-weight:700;color:#7A6555;letter-spacing:.06em}
.draft{display:flex;align-items:center;gap:10px;padding:10px 12px}
.draft+.draft{border-top:2px dashed #F0DFC2}
.tick{width:26px;height:26px;border-radius:9px;background:#4CB872;box-shadow:0 2px 0 #2E8A50;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
.tick-off{background:#FFFFFF;border:2px solid #E6D3B3;box-shadow:none}
.src{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;justify-content:center;border-radius:14px;background:#FFF6E6;font-size:12px;font-weight:700;border:0;font-family:inherit;color:#3B2A20;cursor:pointer}
</style>
</helmet>
<div class="sn" style="width: 390px; height: 844px; position: relative; overflow: hidden;">
  <div style="position: absolute; inset: 0; background: rgba(59,42,32,.42);"></div>

  <section aria-label="ミナに渡す" style="position: absolute; left: 0; right: 0; bottom: 0; top: 64px; background: #FFFFFF; border-radius: 28px 28px 0 0; box-sizing: border-box; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 14px;">
    <div style="width: 44px; height: 5px; border-radius: 999px; background: #E6D3B3; align-self: center;"></div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true"><ellipse cx="25" cy="12" rx="8" ry="4.5" transform="rotate(-30 25 12)" fill="#4CB872"></ellipse><ellipse cx="39" cy="12" rx="8" ry="4.5" transform="rotate(30 39 12)" fill="#4CB872"></ellipse><ellipse cx="32" cy="40" rx="24" ry="21" fill="#FFD36B" stroke="#E09A00" stroke-width="2"></ellipse><ellipse cx="24" cy="38" rx="3" ry="4" fill="#3B2A20"></ellipse><ellipse cx="40" cy="38" rx="3" ry="4" fill="#3B2A20"></ellipse><path d="M28 46q4 4 8 0" stroke="#3B2A20" stroke-width="2.5" fill="none" stroke-linecap="round"></path></svg>
      <h1 class="h" style="margin: 0; font-size: 22px;">ミナに渡す</h1>
      <button class="btn" type="button" aria-label="閉じる" style="margin-left: auto; min-height: 44px; width: 44px; padding: 0; background: #FFF6E6;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <label for="cap" class="label">頭の中をそのまま。1行でも、まとめてでも。</label>
    <textarea id="cap" style="font: inherit; font-size: 16px; line-height: 1.7; min-height: 120px; border: 2px solid #FFC23D; border-radius: 16px; padding: 12px 14px; background: #FFFBF3; color: #3B2A20; resize: none;">明日までに田中さんに見積書
金曜のゼミのリハを1回
英語の勉強、毎朝続けたいかも</textarea>

    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="label">ミナのよみ</span><span class="chip c-xp">クエスト 2</span><span class="chip c-grape">たね 1</span>
    </div>

    <div style="border: 2px solid #F0DFC2; border-radius: 18px;">
      <div class="draft"><span class="tick" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke-width: 3.2;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><div style="flex: 1; display: flex; flex-direction: column; gap: 4px;"><b style="font-size: 15px;">田中さんに見積書を送る</b><div style="display: flex; gap: 5px;"><span class="chip c-sky">あした</span><span class="chip c-plain">★ 15分</span></div></div></div>
      <div class="draft"><span class="tick" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke-width: 3.2;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><div style="flex: 1; display: flex; flex-direction: column; gap: 4px;"><b style="font-size: 15px;">ゼミのリハーサルを1回する</b><div style="display: flex; gap: 5px;"><span class="chip c-sky">金曜</span><span class="chip c-grape">ゼミ発表マップへ</span></div></div></div>
      <div class="draft"><span class="tick" aria-hidden="true" style="background: #9C7BF2; box-shadow: 0 2px 0 #7556D6;"><svg class="ico" viewBox="0 0 24 24" style="width: 16px; height: 16px;"><path d="M12 21v-9M12 12c0-4-3-6-7-6 0 4 3 6 7 6zM12 10c0-3 2-5 6-5 0 3-2 5-6 5z"></path></svg></span><div style="flex: 1; display: flex; flex-direction: column; gap: 4px;"><b style="font-size: 15px;">毎朝 英語を勉強する</b><div style="display: flex; gap: 5px;"><span class="chip c-grape">たねとして保存</span></div></div></div>
    </div>

    <div style="display: flex; gap: 8px;">
      <button class="src" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>写真・資料</button>
      <button class="src" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>声で</button>
      <button class="src" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>議事録・メール</button>
    </div>

    <div style="margin-top: auto; display: flex; gap: 10px;">
      <button class="btn btn-ghost" type="button" style="flex: 1;">まとめて1件</button>
      <button class="btn btn-sun" type="button" style="flex: 1.6;">3つ登録する</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
