services:
  symnote-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ${SYMNOTE_ENV_FILE:-./src/symnote/.env}
    environment:
      DB_PATH: /var/data/owner/symnote.db
      SYMNOTE_DATA_DIR: /var/data
      SYMNOTE_E2E: "0"
      SYMNOTE_ALLOW_NO_PASSCODE: "0"
    volumes:
      - symnote_web_data:/var/data
    restart: unless-stopped
volumes:
  symnote_web_data:
