# Company-level Codex defaults for the primary CEO/manager thread.
# Ultra is selected in the Codex app; it is an orchestration mode, not a
# model_reasoning_effort value. xhigh keeps the Sol manager at the highest
# durable reasoning level supported by project config.
model = "gpt-6.1-sol"
model_reasoning_effort = "mid"

[features]
multi_agent = true

[agents]

enabled = true
max_concurrent_threads_per_session = 3
