<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: light dark; --surface: #fff9e9; --ink: #322817; --edge: #ad7914; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; color: var(--ink); }
.card { position: relative; overflow: hidden; min-height: 270px; padding: 20px; border: 2px solid var(--edge); border-radius: 18px; background: var(--surface); text-align: center; animation: appear .6s cubic-bezier(.2,.8,.2,1.2); }
h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: .12em; }
.banner { display: inline-block; background: linear-gradient(100deg,#b98b29,#f4d67d,#b98b29); color: #211a0e; padding: 5px 18px; border-radius: 6px; }
#titles { margin: 10px auto; max-width: 650px; max-height: 50px; overflow-y: auto; overflow-wrap: anywhere; }
.values { display: flex; justify-content: center; gap: 26px; font-size: 26px; font-weight: 750; }
#level { min-height: 26px; font-weight: 750; animation: glow 1.1s ease-in-out 2; }
#bonuses { font-size: 12px; margin: 6px 0; }
#badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.badge { padding: 4px 8px; border: 1px solid var(--edge); border-radius: 16px; font-size: 12px; }
.particle { pointer-events: none; position: absolute; top: -12px; width: 6px; height: 9px; background: var(--edge); opacity: 0; animation: fall 2s ease-out forwards; }
#play { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--edge); border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 8px; }
@keyframes appear { from { transform: translateY(18px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fall { 10% { opacity: .8; } to { transform: translateY(300px) rotate(280deg); opacity: 0; } }
@keyframes glow { 50% { transform: scale(1.04); } }
@media (prefers-color-scheme: dark) { :root { --surface: #272217; --ink: #f8efdb; --edge: #d6b45f; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .particle { display: none; } }
</style>
</head>
<body>
<section class="card" aria-label="クエスト完了" role="status">
<h1><span class="banner">QUEST CLEAR!</span></h1>
<div id="titles"></div>
<div class="values"><span id="xp"></span><span id="gold"></span></div>
<div id="level"></div><div id="bonuses"></div><div id="badges"></div>
<button id="play" type="button" hidden>効果音を再生</button>
</section>
<script>
'use strict';
const payload = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__QUEST_PAYLOAD_BASE64__'), c => c.charCodeAt(0))));
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/** 指定要素に文字列として表示する。@param {string} id @param {string} text @returns {void} */
const setText = (id, text) => { document.getElementById(id).textContent = text; };
setText('titles', payload.titles.join(' / '));
setText('bonuses', payload.bonuses.join(' ・ '));
if (payload.levelAfter > payload.levelBefore) setText('level', `LEVEL UP! Lv.${payload.levelBefore} → Lv.${payload.levelAfter}`);
for (const name of payload.achievements) {
  const badge = document.createElement('span');
  badge.className = 'badge'; badge.textContent = `実績解除 ${name}`;
  document.getElementById('badges').appendChild(badge);
}
/** 経験値とゴールドを同時に加算表示する。@returns {void} */
function countRewards() {
  const start = performance.now();
  /** 経過時間に応じて表示値を更新する。@param {number} now @returns {void} */
  function frame(now) {
    const ratio = reduced ? 1 : Math.min(1, (now - start) / 850);
    setText('xp', `+${Math.round(payload.xp * ratio)} XP`);
    setText('gold', `+${Math.round(payload.gold * ratio)} G`);
    if (ratio < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
countRewards();
if (!reduced) {
  for (let i = 0; i < 28; i++) {
    const particle = document.createElement('span');
    particle.className = 'particle'; particle.setAttribute('aria-hidden', 'true');
    particle.style.left = `${(i * 37) % 100}%`;
    particle.style.animationDelay = `${(i % 7) * .07}s`;
    document.querySelector('.card').appendChild(particle);
    particle.addEventListener('animationend', () => particle.remove());
  }
}
/** 自動再生制限による失敗を許容して短い効果音を再生する。@returns {Promise<void>} */
async function playSound() {
  let audio;
  try {
    const AudioClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioClass) return;
    audio = new AudioClass();
    await audio.resume();
    if (audio.state !== 'running') return;
    const notes = payload.levelAfter > payload.levelBefore ? [523.25,659.25,783.99,1046.5] : [523.25,659.25,783.99];
    notes.forEach((frequency, index) => {
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      const start = audio.currentTime + index * .1;
      oscillator.type = 'sine'; oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(.07, start + .015);
      gain.gain.exponentialRampToValueAtTime(.001, start + .16);
      oscillator.connect(gain); gain.connect(audio.destination);
      oscillator.start(start); oscillator.stop(start + .18);
    });
    setTimeout(() => { audio.close().catch(() => {}); }, 1000);
  } catch (_) {
    if (audio) audio.close().catch(() => {});
  }
}
if (payload.sound) {
  const button = document.getElementById('play');
  button.hidden = false; button.addEventListener('click', playSound);
  playSound();
}
</script>
</body>
</html>
