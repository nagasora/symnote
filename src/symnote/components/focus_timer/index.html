<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>集中タイマー</title>
<style>
:root {color-scheme:light; --surface:#fcfcfb; --ink:#0b0b0b; --muted:#52514e;
  --accent:#2a78d6; --track:#e6eef9}
@media(prefers-color-scheme:dark) {
  :root {color-scheme:dark; --surface:#1a1a19; --ink:#f0efec; --muted:#c3c2b7;
    --accent:#3987e5; --track:#25354a}
}
body {margin:0; background:var(--surface); color:var(--ink); font-family:system-ui,sans-serif;
  text-align:center; padding:12px; box-sizing:border-box}
.meter {position:relative; width:min(260px,85vw); aspect-ratio:1; margin:0 auto}
svg {width:100%; height:100%; transform:rotate(-90deg)}
circle {fill:none; stroke-width:5}
.track {stroke:var(--track)}
.remaining {stroke:var(--accent); stroke-linecap:round; stroke-dasharray:100}
.reading {position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center}
#clock {font-size:clamp(40px,15vw,58px); font-variant-numeric:tabular-nums; font-weight:600}
.label, #status {color:var(--muted); font-size:14px}
#status {margin:12px 0}
button {background:var(--surface); color:var(--ink); border:1px solid var(--muted);
  border-radius:8px; padding:8px 14px; cursor:pointer; min-height:40px}
button:focus-visible {outline:3px solid var(--accent); outline-offset:3px}
@media(forced-colors:active) {
  .remaining {stroke:Highlight} .track {stroke:GrayText; stroke-dasharray:2 2}
}
@media(prefers-reduced-motion:reduce) {* {animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="meter" role="timer" aria-label="集中の残り時間" aria-live="off">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <circle class="track" cx="60" cy="60" r="54"/>
    <circle class="remaining" id="ring" cx="60" cy="60" r="54" pathLength="100"/>
  </svg>
  <div class="reading"><span class="label">残り時間</span><span id="clock">--:--</span></div>
</div>
<p id="status" role="status">今は、このひとつだけ。</p>
<button id="sound" type="button" aria-pressed="false">終了音を有効にする</button>
<script>
"use strict";
const payload = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__FOCUS_PAYLOAD_BASE64__'), c => c.charCodeAt(0))));
const duration = payload.plannedMinutes * 60 * 1000;
const deadline = Date.parse(payload.startedAt) + duration;
const clock = document.getElementById('clock');
const ring = document.getElementById('ring');
const status = document.getElementById('status');
const sound = document.getElementById('sound');
let context = null;
let finished = false;

/** ユーザー操作が許可した場合だけ、短い終了音を鳴らす。 */
async function playChime() {
  if (!context) return;
  try {
    await context.resume();
    if (context.state !== 'running') return;
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.frequency.value = 660;
    gain.gain.setValueAtTime(0.08, context.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.35);
    oscillator.start();
    oscillator.stop(context.currentTime + 0.4);
  } catch (_) {
    status.textContent = '集中時間になりました。ひと息つきましょう。（終了音は利用できません）';
  }
}

/** 自動再生制限を避けるため、明示操作で音声を準備する。 */
async function enableSound() {
  if (context) {
    await context.close().catch(() => {});
    context = null;
    sound.textContent = '終了音を有効にする';
    sound.setAttribute('aria-pressed', 'false');
    return;
  }
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    context = new AudioContext();
    await context.resume();
    sound.textContent = '終了音を無効にする';
    sound.setAttribute('aria-pressed', 'true');
  } catch (_) {
    context = null;
    sound.textContent = '終了音は利用できません（画面でお知らせします）';
    sound.disabled = true;
  }
}

/** 絶対時刻から残り時間を計算し、バックグラウンドから戻っても遅延させない。 */
function updateTimer() {
  const remaining = Math.max(0, deadline - Date.now());
  const seconds = Math.ceil(remaining / 1000);
  clock.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
  ring.style.strokeDashoffset = String(100 * (1 - Math.min(1, remaining / duration)));
  ring.parentElement.parentElement.title = `残り ${Math.floor(seconds / 60)}分 ${seconds % 60}秒 / 予定 ${payload.plannedMinutes}分`;
  if (remaining === 0 && !finished) {
    finished = true;
    status.textContent = '集中時間になりました。ひと息つきましょう。';
    if (context) void playChime();
    clearInterval(interval);
  }
}
sound.addEventListener('click', enableSound);
document.addEventListener('visibilitychange', updateTimer);
const interval = setInterval(updateTimer, 1000);
updateTimer();
</script>
</body>
</html>
