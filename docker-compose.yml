services:
  symnote:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: symnote
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - symnote_data:/data
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DB_PATH: /data/symnote.db
    restart: unless-stopped

volumes:
  symnote_data:
